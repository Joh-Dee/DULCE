<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DULCE</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ========== LOGIN PAGE ========== -->
<section id="loginPage" class="auth-page">
  <div class="auth-bg-orb"></div>
  <div class="auth-bg-orb-secondary"></div>

  <div class="auth-wrap">
    <div class="auth-logo">
      <div class="auth-logo-icon"></div>
    </div>

    <h1 class="auth-title">DULCE</h1>
    <p class="auth-subtitle">stay sweet, stay connected</p>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="your@email.com" required />
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="" required minlength="6" />
      </div>
      <div id="loginError" class="auth-error hidden"></div>
      <button type="submit" class="auth-btn">Sign In</button>
    </form>

    <p class="auth-switch">
      Don't have an account? <span id="showRegister">Create one</span>
    </p>
  </div>
</section>

<!-- ========== REGISTER PAGE ========== -->
<section id="registerPage" class="auth-page hidden">
  <div class="auth-bg-orb"></div>
  <div class="auth-bg-orb-secondary"></div>

  <div class="auth-wrap">
    <div class="auth-logo">
      <div class="auth-logo-icon"></div>
    </div>

    <h1 class="auth-title">DULCE</h1>
    <p class="auth-subtitle">create your sweet account</p>

    <!-- Register Form -->
    <form id="registerForm" class="auth-form">
      <div class="input-group">
        <label>Display Name</label>
        <input type="text" id="regName" placeholder="Your name" required />
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="your@email.com" required />
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="" required minlength="6" />
      </div>

      <!-- Gender -->
      <label class="input-label">I am a</label>
      <div class="gender-grid">
        <div class="gender-card" data-gender="boy">
          <span></span> Boy
        </div>
        <div class="gender-card" data-gender="girl">
          <span></span> Girl
        </div>
      </div>

      <!-- Avatar Selection -->
      <label class="input-label">Choose Avatar</label>
      <div id="avatarGrid" class="avatar-grid"></div>

      <div id="registerError" class="auth-error hidden"></div>
      <button type="submit" class="auth-btn">Create Account</button>
    </form>

    <p class="auth-switch">
      Already have an account? <span id="showLogin">Sign In</span>
    </p>
  </div>
</section>

<script src="supabase.min.js"></script>
<script src="script.js"></script>
</body>
</html>
